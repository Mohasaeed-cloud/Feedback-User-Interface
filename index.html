<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback User Interface</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="outerContainer shadow-lg container w-25 rounded-3 d-flex flex-column py-4 gap-4">
            <h3 class="text-center">How was your experience?</h3>
            <div class="d-flex w-100 justify-content-center gap-3">
                <button class="border-0 bg-white p-2 rounded-1 d-flex flex-column align-items-center gap-2 ratingButton"><img src="./Icons/Unhappy_full_capacity.png" style="width: 32px;height: 32px;" alt="">Unhappy</button>
                <button class="border-0 bg-white p-2 rounded-1 d-flex flex-column align-items-center gap-2 ratingButton"><img src="./Icons/neutral_full_capacity.png" style="width: 32px;height: 32px;" alt="">Neutral</button>
                <button class="border-0 bg-white p-2 rounded-1 d-flex flex-column align-items-center gap-2 ratingButton"><img src="./Icons/satisfied2.png" style="width: 32px;height: 32px;" alt="">Satisfied</button>
            </div>
            <div class="text-center sendReview">
                <button disabled class="srv py-2 border rounded-2 text-white w-75 sendReviewButton">Send Review</button>
            </div>
        </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
